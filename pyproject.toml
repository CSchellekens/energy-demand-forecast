[project]
name = "energy-demand-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chris", email = "49312736+d4rkning@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "entsoe-py>=0.8.1",
    "holidays>=0.108",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
energy-demand-forecasting = "energy_demand_forecasting:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "N", "PD", "NPY", "DTZ", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pre-commit>=4.7.0",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
